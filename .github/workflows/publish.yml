# Publishes to pub.dev when a version tag is pushed.
# Requires automated publishing enabled on pub.dev (see README).
#
# Tag pattern on pub.dev must be: v{{version}}
# Example: pubspec version 0.2.0 → git tag v0.2.0 && git push origin v0.2.0

name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    permissions:
      id-token: write # OIDC token for pub.dev (no long-lived secrets)
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
